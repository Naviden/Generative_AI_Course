<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Conditioning changes the denominator</title>
<desc id="desc">100 records: 20 both blue and large, 20 blue only, 10 large only, and 50 neither. Among 30 large records, 20 are blue: two thirds. Among 40 blue records, 20 are large: one half.</desc>
