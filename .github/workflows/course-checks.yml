name: Course checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/core.lock
      - name: Install locked CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/core.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - run: python -m pytest
      - run: python scripts/check_materials.py
      - name: Run classroom examples
        run: |
          python -m genai_course.labs attention
          python -m genai_course.labs vae --steps 300
          python -m genai_course.labs flow --steps 300
          python -m genai_course.labs dpo --steps 100 --beta 0.1
      - uses: actions/upload-artifact@v7
        with:
          name: lab-results-python-${{ matrix.python-version }}
          path: runs/
